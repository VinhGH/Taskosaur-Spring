map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets
    location /_next/static/ {
        alias /usr/share/nginx/html/_next/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /locales/ {
        alias /usr/share/nginx/html/locales/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # API reverse proxy to Spring Boot
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket reverse proxy to Spring Boot
    location /ws {
        proxy_pass http://backend:3000/ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Uploads reverse proxy to Spring Boot
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Cache static root assets directly (icons, manifests, svgs, images)
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot|css|js|map|json|xml|webmanifest|txt)$ {
        try_files $uri =404;
        access_log off;
    }

    # Next.js dynamic routes rewrite rules (static HTML export)
    # Top-level dynamic routes
    rewrite ^/admin/organizations/([^/]+)/?$ /admin/organizations/[id]/index.html last;
    rewrite ^/admin/users/([^/]+)/?$ /admin/users/[id]/index.html last;
    rewrite ^/join/([^/]+)/?$ /join/[inviteCode]/index.html last;
    rewrite ^/public/task/([^/]+)/?$ /public/task/[token]/index.html last;
    rewrite ^/settings/profile/?$ /settings/profile/index.html last;
    rewrite ^/settings/?$ /settings/index.html last;
    rewrite ^/settings/(?!profile(?:/|$))([^/]+)/?$ /settings/[slug]/index.html last;
    rewrite ^/tasks/([^/]+)/?$ /tasks/[taskId]/index.html last;

    # Project-level routes: /:workspaceSlug/:projectSlug/... (4 segments)
    rewrite "^/(?!(?:api|uploads|_next|locales|404|activities|admin|dashboard|forgot-password|intro|invite|join|login|notifications|organization|privacy-policy|projects|public|register|reset-password|settings|setup|tasks|terms-of-service|workspaces)(?:/|$))([^/.]+)/([^/.]+)/tasks/new/?$" /[workspaceSlug]/[projectSlug]/tasks/new/index.html last;
    rewrite "^/(?!(?:api|uploads|_next|locales|404|activities|admin|dashboard|forgot-password|intro|invite|join|login|notifications|organization|privacy-policy|projects|public|register|reset-password|settings|setup|tasks|terms-of-service|workspaces)(?:/|$))([^/.]+)/([^/.]+)/tasks/([^/]+)/?$" /[workspaceSlug]/[projectSlug]/tasks/[taskId]/index.html last;
    rewrite "^/(?!(?:api|uploads|_next|locales|404|activities|admin|dashboard|forgot-password|intro|invite|join|login|notifications|organization|privacy-policy|projects|public|register|reset-password|settings|setup|tasks|terms-of-service|workspaces)(?:/|$))([^/.]+)/([^/.]+)/sprints/([^/]+)/?$" /[workspaceSlug]/[projectSlug]/sprints/[sprintId]/index.html last;

    # Project-level routes: /:workspaceSlug/:projectSlug/... (3 segments)
    rewrite "^/(?!(?:api|uploads|_next|locales|404|activities|admin|dashboard|forgot-password|intro|invite|join|login|notifications|organization|privacy-policy|projects|public|register|reset-password|settings|setup|tasks|terms-of-service|workspaces)(?:/|$))([^/.]+)/([^/.]+)/(calendar|chat|members|settings|sprints|tasks)/?$" /[workspaceSlug]/[projectSlug]/$3/index.html last;

    # Workspace-level routes: /:workspaceSlug/... (3 segments)
    rewrite "^/(?!(?:api|uploads|_next|locales|404|activities|admin|dashboard|forgot-password|intro|invite|join|login|notifications|organization|privacy-policy|projects|public|register|reset-password|settings|setup|tasks|terms-of-service|workspaces)(?:/|$))([^/.]+)/tasks/new/?$" /[workspaceSlug]/tasks/new/index.html last;
    rewrite "^/(?!(?:api|uploads|_next|locales|404|activities|admin|dashboard|forgot-password|intro|invite|join|login|notifications|organization|privacy-policy|projects|public|register|reset-password|settings|setup|tasks|terms-of-service|workspaces)(?:/|$))([^/.]+)/tasks/([^/]+)/?$" /[workspaceSlug]/tasks/[taskId]/index.html last;
    rewrite "^/(?!(?:api|uploads|_next|locales|404|activities|admin|dashboard|forgot-password|intro|invite|join|login|notifications|organization|privacy-policy|projects|public|register|reset-password|settings|setup|tasks|terms-of-service|workspaces)(?:/|$))([^/.]+)/members/([^/]+)/?$" /[workspaceSlug]/members/[id]/index.html last;

    # Workspace-level sub-routes: /:workspaceSlug/(activities|chat|members|projects|settings|tasks) (2 segments)
    rewrite "^/(?!(?:api|uploads|_next|locales|404|activities|admin|dashboard|forgot-password|intro|invite|join|login|notifications|organization|privacy-policy|projects|public|register|reset-password|settings|setup|tasks|terms-of-service|workspaces)(?:/|$))([^/.]+)/(activities|chat|members|projects|settings|tasks)/?$" /[workspaceSlug]/$2/index.html last;

    # Project root: /:workspaceSlug/:projectSlug (2 segments)
    rewrite "^/(?!(?:api|uploads|_next|locales|404|activities|admin|dashboard|forgot-password|intro|invite|join|login|notifications|organization|privacy-policy|projects|public|register|reset-password|settings|setup|tasks|terms-of-service|workspaces)(?:/|$))([^/.]+)/([^/.]+)/?$" /[workspaceSlug]/[projectSlug]/index.html last;

    # Workspace root: /:workspaceSlug (1 segment)
    rewrite "^/(?!(?:api|uploads|_next|locales|404|activities|admin|dashboard|forgot-password|intro|invite|join|login|notifications|organization|privacy-policy|projects|public|register|reset-password|settings|setup|tasks|terms-of-service|workspaces)(?:/|$))([^/.]+)/?$" /[workspaceSlug]/index.html last;

    # Next.js static pages with HTML fallback
    location / {
        try_files $uri $uri/index.html $uri.html $uri/ /index.html;
    }
}
