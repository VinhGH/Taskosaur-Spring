server:
  port: ${SERVER_PORT:3000}

spring:
  datasource:
    url: ${SPRING_DATABASE_URL:jdbc:postgresql://localhost:5435/taskosaur?stringtype=unspecified&options=-c%20timezone%3DUTC}
    username: ${POSTGRES_USER:taskosaur}
    password: ${POSTGRES_PASSWORD:taskosaur}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "SET TIME ZONE 'UTC'"

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_FILE_SIZE:10MB}

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          timeout: 10000
          connectiontimeout: 10000
          writetimeout: 10000

jwt:
  secret: ${JWT_SECRET:change-this-in-production}
  access-token-expiration: ${JWT_ACCESS_EXPIRY_MS:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRY_MS:604800000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3001}
  cors-origin: ${CORS_ORIGIN:http://localhost:3001}
  upload-dest: ${UPLOAD_DEST:./uploads}
  smtp-from: ${SMTP_FROM:noreply@taskosaur.com}

ai:
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    api-url: ${OPENROUTER_API_URL:https://openrouter.ai/api/v1}
    model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
    max-tokens: ${AI_MAX_TOKENS:4000}
    timeout-ms: ${AI_REQUEST_TIMEOUT_MS:60000}