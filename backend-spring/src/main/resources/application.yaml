server:
  port: 3000

spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/taskosaur?options=-c%20timezone%3DUTC
    username: taskosaur
    password: taskosaur
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "SET TIME ZONE 'UTC'"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

  jwt:
    # Chuỗi bí mật tối thiểu 32 ký tự dùng để ký HMAC-SHA256
    secret: your-super-secret-jwt-key-taskosaur-spring-boot-project-2026-very-long-key
    # 15 phút (ms)
    access-token-expiration: 900000
    # 7 ngày (ms)
    refresh-token-expiration: 604800000