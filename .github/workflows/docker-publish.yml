name: Docker Container Publishing

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to Registry (Docker Hub / GHCR)'
        required: true
        type: boolean
        default: true
      tag_override:
        description: 'Custom tag override (optional)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  DOCKER_ORG: ${{ secrets.DOCKER_ORG || 'taskosaur' }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    name: Build & Publish Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Tags & Repository
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.1.0")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          # Docker image names MUST be strictly lowercase
          LOWER_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          LOWER_ORG=$(echo "${{ env.DOCKER_ORG }}" | tr '[:upper:]' '[:lower:]')
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_override }}" ]; then
            TAG="${{ github.event.inputs.tag_override }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAG="latest"
          else
            TAG="${SHORT_SHA}"
          fi

          echo "primary_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "lower_owner=${LOWER_OWNER}" >> $GITHUB_OUTPUT
          echo "lower_org=${LOWER_ORG}" >> $GITHUB_OUTPUT
          
          # Determine if Docker Hub credentials exist
          HAS_DOCKER_HUB="false"
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            HAS_DOCKER_HUB="true"
          fi
          echo "has_docker_hub=${HAS_DOCKER_HUB}" >> $GITHUB_OUTPUT

          # Determine whether to push
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_PUSH="${{ github.event.inputs.push }}"
          elif [ "$HAS_DOCKER_HUB" = "true" ] || [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            SHOULD_PUSH="true"
          else
            SHOULD_PUSH="false"
          fi
          echo "should_push=${SHOULD_PUSH}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: steps.meta.outputs.should_push == 'true' && steps.meta.outputs.has_docker_hub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.meta.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =======================================================================
      # 1. Build & Push Backend Container (Java 25 Spring Boot)
      # =======================================================================
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.meta.outputs.should_push == 'true' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.lower_owner }}/backend:${{ steps.meta.outputs.primary_tag }}
            ghcr.io/${{ steps.meta.outputs.lower_owner }}/backend:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.has_docker_hub == 'true' && format('{0}/backend:{1}', steps.meta.outputs.lower_org, steps.meta.outputs.primary_tag) || '' }}
            ${{ steps.meta.outputs.has_docker_hub == 'true' && format('{0}/backend:{1}-{2}', steps.meta.outputs.lower_org, steps.meta.outputs.version, steps.meta.outputs.short_sha) || '' }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # =======================================================================
      # 2. Build & Push Frontend Container (Next.js 16 + Nginx)
      # =======================================================================
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.meta.outputs.should_push == 'true' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.lower_owner }}/frontend:${{ steps.meta.outputs.primary_tag }}
            ghcr.io/${{ steps.meta.outputs.lower_owner }}/frontend:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.has_docker_hub == 'true' && format('{0}/frontend:{1}', steps.meta.outputs.lower_org, steps.meta.outputs.primary_tag) || '' }}
            ${{ steps.meta.outputs.has_docker_hub == 'true' && format('{0}/frontend:{1}-{2}', steps.meta.outputs.lower_org, steps.meta.outputs.version, steps.meta.outputs.short_sha) || '' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # =======================================================================
      # 3. Build & Push DB Migrate Container (Prisma Migrations)
      # =======================================================================
      - name: Build & Push DB Migrate Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/db-migrate.Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.meta.outputs.should_push == 'true' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.lower_owner }}/db-migrate:${{ steps.meta.outputs.primary_tag }}
            ghcr.io/${{ steps.meta.outputs.lower_owner }}/db-migrate:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.has_docker_hub == 'true' && format('{0}/db-migrate:{1}', steps.meta.outputs.lower_org, steps.meta.outputs.primary_tag) || '' }}
            ${{ steps.meta.outputs.has_docker_hub == 'true' && format('{0}/db-migrate:{1}-{2}', steps.meta.outputs.lower_org, steps.meta.outputs.version, steps.meta.outputs.short_sha) || '' }}
          cache-from: type=gha,scope=db-migrate
          cache-to: type=gha,mode=max,scope=db-migrate

      # =======================================================================
      # 4. Summary & Pull Instructions
      # =======================================================================
      - name: Publish Step Summary
        run: |
          echo "## 🚀 Docker Publishing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Primary Tag**: \`${{ steps.meta.outputs.primary_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ steps.meta.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms**: \`${{ env.PLATFORMS }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pushed**: \`${{ steps.meta.outputs.should_push }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Deployed Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.meta.outputs.lower_owner }}/backend:${{ steps.meta.outputs.primary_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.meta.outputs.lower_owner }}/frontend:${{ steps.meta.outputs.primary_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.meta.outputs.lower_owner }}/db-migrate:${{ steps.meta.outputs.primary_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💻 Pull Commands" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ steps.meta.outputs.lower_owner }}/backend:${{ steps.meta.outputs.primary_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ steps.meta.outputs.lower_owner }}/frontend:${{ steps.meta.outputs.primary_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ steps.meta.outputs.lower_owner }}/db-migrate:${{ steps.meta.outputs.primary_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
