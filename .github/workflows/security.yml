name: Security & Vulnerability Audit

on:
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday 00:00 UTC
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run NPM Audit
        run: |
          echo "Auditing production dependencies for security vulnerabilities..."
          npm audit --omit=dev || true
