services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskosaur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskosaur}
      POSTGRES_DB: ${POSTGRES_DB:-taskosaur}
    command: postgres -c timezone=UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskosaur}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskosaur-network
    ports:
      - "5435:5432"

  # Redis In-Memory Cache & Rate Limiter
  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskosaur-network
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # Application (Java 25 Spring Boot Backend + Next.js Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    env_file:
      - .env
    environment:
      # Database connection for Prisma (migrations) and Spring Boot (JPA / JDBC)
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskosaur}:${POSTGRES_PASSWORD:-taskosaur}@postgres:5432/${POSTGRES_DB:-taskosaur}
      SPRING_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-taskosaur}?stringtype=unspecified&options=-c%20timezone%3DUTC
      POSTGRES_USER: ${POSTGRES_USER:-taskosaur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskosaur}
      POSTGRES_DB: ${POSTGRES_DB:-taskosaur}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 3000
      FRONTEND_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3001,http://127.0.0.1:3001
      # Frontend environment variable for API connection
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
    ports:
      - "3000:3000" # Backend (Spring Boot)
      - "3001:3001" # Frontend (Next.js)
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/backend/target
      - app_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taskosaur-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_uploads:
    driver: local

networks:
  taskosaur-network:
    driver: bridge
